<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Show</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f5f7;
        color: #333;
        margin: 0;
        padding: 35px 20px;
    }

    .container {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        padding: 28px;
        background-color: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
    }

    h1 {
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        color: #292929;
        margin: 0 0 25px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #444;
    }

    input,
    select {
        display: block;
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #d5d5d5;
        border-radius: 5px;
        background-color: #fff;
        color: #333;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: #777;
    }

    select {
        cursor: pointer;
    }

    button {
        width: 100%;
        margin-top: 4px;
        padding: 11px;
        background-color: #333;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
    }

    button:hover {
        background-color: #1f1f1f;
    }

    .back {
        display: block;
        width: fit-content;
        margin: 22px auto 0;
        color: #444;
        font-size: 14px;
        text-decoration: none;
    }

    .back:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        body {
            padding: 25px 14px;
        }

        .container {
            padding: 22px 18px;
        }

        h1 {
            font-size: 24px;
        }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Add Show</h1>

  <form th:action="@{/shows/add}"
        th:object="${show}"
        method="post">

    <!-- Movie -->
    <div class="form-group">
      <label for="movie">Movie</label>

      <select id="movie"
              th:field="*{movieModel}"
              required>

        <option value="">Select Movie</option>

        <option th:each="movie : ${movies}"
                th:value="${movie.movieId}"
                th:text="${movie.movieTitle}">
        </option>

      </select>
    </div>

    <!-- Screen -->
    <div class="form-group">
      <label for="screen">Screen</label>

      <select id="screen"
              th:field="*{screenModel}"
              required>

        <option value="">Select Screen</option>

        <option th:each="screen : ${screens}"
                th:value="${screen.screenId}"
                th:text="${screen.screenName + ' - ' + screen.theatre.theatreName}">
        </option>

      </select>
    </div>

    <!-- Date -->
    <div class="form-group">
      <label for="showDate">Show Date</label>

      <input type="date"
             id="showDate"
             th:field="*{showDate}"
             required>
    </div>

    <!-- Start Time -->
    <div class="form-group">
      <label for="showStartTime">Start Time</label>

      <input type="time"
             id="showStartTime"
             th:field="*{showStartTime}"
             required>
    </div>

    <!-- End Time -->
    <div class="form-group">
      <label for="showEndTime">End Time</label>

      <input type="time"
             id="showEndTime"
             th:field="*{showEndTime}"
             required>
    </div>

    <!-- Price -->
    <div class="form-group">
      <label for="price">Ticket Price</label>

      <input type="number"
             id="price"
             th:field="*{price}"
             min="0"
             step="0.01"
             required>
    </div>

    <button type="submit">Add Show</button>

  </form>

  <a href="/shows" class="back">Back to Shows</a>

</div>

</body>
</html>
