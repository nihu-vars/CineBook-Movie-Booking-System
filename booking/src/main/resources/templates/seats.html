
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Selection - CineBook</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            color: #333;
        }

        header {
            background-color: #fff;
            padding: 18px 30px;
            border-bottom: 1px solid #e0e0e0;
        }

        header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            font-size: 28px;
            margin: 0 0 25px;
        }

        .show-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .info-item {
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 12px 18px;
            font-size: 14px;
        }

        .info-item strong {
            margin-right: 5px;
        }

        .seat-card {
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 30px 20px;
            overflow: hidden;
        }

        .screen {
            width: 80%;
            max-width: 600px;
            margin: 0 auto 35px;
            padding: 12px;
            background-color: #e5e5e5;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #555;
        }

        .seat-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            overflow-x: auto;
            padding: 5px 0 15px;
        }

        .seat-row {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .seat {
            width: 45px;
            height: 40px;
            flex-shrink: 0;
            border: 1px solid #bbb;
            border-radius: 5px 5px 3px 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: #fff;
            color: #333;
            font-size: 12px;
            transition: background-color 0.15s;
        }

        .seat:hover {
            background-color: #eee;
        }

        .seat.selected {
            background-color: #333;
            color: #fff;
            border-color: #333;
        }

        .seat.selected:hover {
            background-color: #222;
        }

        .seat.booked {
            background-color: #d6d6d6;
            color: #888;
            border-color: #ccc;
            cursor: not-allowed;
        }

        .seat.booked:hover {
            background-color: #d6d6d6;
        }

        .seat-legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 25px 0 5px;
            font-size: 13px;
            color: #555;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .legend-seat {
            width: 18px;
            height: 18px;
            border: 1px solid #bbb;
            border-radius: 3px;
            background-color: #fff;
        }

        .legend-seat.selected {
            background-color: #333;
            border-color: #333;
        }

        .legend-seat.booked {
            background-color: #d6d6d6;
            border-color: #ccc;
        }

        .booking-info {
            max-width: 550px;
            margin: 30px auto 0;
            padding: 25px;
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        .booking-info h3 {
            font-size: 17px;
            margin: 0 0 12px;
        }

        #selectedSeats {
            min-height: 20px;
            margin: 0 0 22px;
            color: #555;
            overflow-wrap: anywhere;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            border-top: 1px solid #e5e5e5;
        }

        .total-row h3 {
            margin: 0;
        }

        .book-button {
            width: 100%;
            margin-top: 22px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .book-button:hover {
            background-color: #222;
        }

        .book-button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        .error-message {
            color: #b42318;
            margin: 15px 0 0;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header {
                padding: 16px 20px;
            }

            .container {
                margin: 25px auto;
                padding: 0 12px;
            }

            .page-title {
                font-size: 23px;
            }

            .show-info {
                gap: 8px;
            }

            .info-item {
                padding: 10px 12px;
            }

            .seat-card {
                padding: 25px 10px;
            }

            .screen {
                width: 90%;
            }

            .seat-row {
                gap: 5px;
            }

            .seat {
                width: 34px;
                height: 34px;
                font-size: 10px;
            }

            .booking-info {
                padding: 20px;
            }
        }
    </style>
</head>

<body th:attr="data-show-id=${show.showId}">

<header>
    <h2>CineBook</h2>
</header>

<div class="container">

    <h1 class="page-title"
        th:text="${show.movieModel.movieTitle}">
        Movie Name
    </h1>

    <div class="show-info">
        <div class="info-item">
            <strong>Date:</strong>
            <span th:text="${show.showDate}">2026-09-02</span>
        </div>

        <div class="info-item">
            <strong>Show Time:</strong>
            <span th:text="${show.showStartTime}">18:00</span>
        </div>

        <div class="info-item">
            <strong>Price:</strong>
            ₹<span id="seatPrice" th:text="${show.price}">200</span>
            per seat
        </div>
    </div>

    <div class="seat-card">

        <div class="screen">
            SCREEN
        </div>

        <!-- Seat Layout -->
        <div class="seat-layout">

            <div class="seat-row" th:each="row : ${seatLayout}">

                <div class="seat"
                     th:each="seat : ${row.value}"
                     th:data-seat-id="${seat.seatId}"
                     th:data-seat-number="${seat.seatNumber}"
                     th:classappend="${bookedSeatIds.contains(seat.seatId)} ? ' booked' : ''"
                     th:onclick="${bookedSeatIds.contains(seat.seatId)} ? '' : 'selectSeat(this)'">

                    <span th:text="${seat.seatNumber}">A1</span>

                </div>

            </div>

        </div>

        <!-- Seat Legend -->
        <div class="seat-legend">
            <div class="legend-item">
                <span class="legend-seat"></span>
                Available
            </div>

            <div class="legend-item">
                <span class="legend-seat selected"></span>
                Selected
            </div>

            <div class="legend-item">
                <span class="legend-seat booked"></span>
                Booked
            </div>
        </div>

    </div>

    <!-- Booking Information -->
    <div class="booking-info">

        <h3>Selected Seats</h3>

        <p id="selectedSeats">None</p>

        <div class="total-row">
            <h3>Total Amount</h3>
            <h3>₹<span id="totalAmount">0</span></h3>
        </div>

        <button id="bookButton"
                class="book-button"
                onclick="bookSeats()">
            BOOK NOW
        </button>

        <p id="errorMessage" class="error-message"></p>

    </div>

</div>

<script>
    let selectedSeats = [];

    function selectSeat(seatElement) {

        // Do nothing if the seat is already booked
        if (seatElement.classList.contains("booked")) {
            return;
        }

        const seatId = seatElement.dataset.seatId;
        const seatNumber = seatElement.dataset.seatNumber;

        // If already selected, unselect it
        if (selectedSeats.some(seat => seat.id === seatId)) {

            selectedSeats = selectedSeats.filter(
                seat => seat.id !== seatId
            );

            seatElement.classList.remove("selected");

        } else {

            // Otherwise, select the seat
            selectedSeats.push({
                id: seatId,
                number: seatNumber
            });

            seatElement.classList.add("selected");
        }

        updateBookingInfo();
    }

    function updateBookingInfo() {

        const selectedSeatsElement =
            document.getElementById("selectedSeats");

        const totalAmountElement =
            document.getElementById("totalAmount");

        if (selectedSeats.length === 0) {
            selectedSeatsElement.innerText = "None";
            totalAmountElement.innerText = "0";
            return;
        }

        const seatNumbers = selectedSeats.map(
            seat => seat.number
        );

        selectedSeatsElement.innerText =
            seatNumbers.join(", ");

        const seatPrice = Number(
            document.getElementById("seatPrice").innerText
        );

        const total = seatPrice * selectedSeats.length;

        totalAmountElement.innerText = total;
    }

    async function bookSeats() {

        if (selectedSeats.length === 0) {
            alert("Please select at least one seat.");
            return;
        }

        const bookButton = document.getElementById("bookButton");
        const errorMessage = document.getElementById("errorMessage");

        errorMessage.innerText = "";
        bookButton.disabled = true;
        bookButton.innerText = "Processing...";

        try {

            // Get show ID from the body
            const showId = Number(document.body.dataset.showId);

            // Get selected seat IDs
            const seatIds = selectedSeats.map(
                seat => Number(seat.id)
            );

            // Create booking request
            const bookingRequest = {
                showId: showId,
                seatIds: seatIds
            };

            // Send request to the backend
            const response = await fetch("/booking/create", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(bookingRequest)
            });

            if (!response.ok) {
                const errorText = await response.text();

                throw new Error(
                    errorText || "Booking failed."
                );
            }

            // Backend returns JSON, for example: {"bookingId":1452}
            const data = await response.json();

            if (!data.bookingId) {
                throw new Error("Booking ID was not returned.");
            }

            // Redirect to the payment page
            window.location.href =
                `/booking/payment/${data.bookingId}`;

        } catch (error) {

            console.error("Booking error:", error);

            errorMessage.innerText =
                "Unable to create booking. Please try again.";

            bookButton.disabled = false;
            bookButton.innerText = "BOOK NOW";
        }
    }
</script>

</body>
</html>
