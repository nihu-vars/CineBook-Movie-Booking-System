
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Screen - CineBook</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        color: #333;
    }

    .header {
        background-color: #fff;
        padding: 18px 30px;
        border-bottom: 1px solid #e0e0e0;
    }

    .header h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
    }

    .container {
        width: 600px;
        max-width: calc(100% - 30px);
        margin: 35px auto;
        background-color: #fff;
        padding: 30px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
    }

    h1 {
        text-align: center;
        font-size: 26px;
        margin: 0 0 28px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 600;
    }

    input,
    select {
        display: block;
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #fff;
        color: #333;
        font-family: Arial, sans-serif;
        font-size: 14px;
        outline: none;
    }

    input:focus,
    select:focus {
        border-color: #666;
        box-shadow: 0 0 0 2px rgba(51, 51, 51, 0.08);
    }

    .section-title {
        font-size: 16px;
        font-weight: 600;
        margin: 25px 0 18px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e5e5e5;
    }

    .seat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 28px;
    }

    .update-btn,
    .cancel-btn {
        display: inline-block;
        padding: 12px 20px;
        border: 1px solid #333;
        border-radius: 4px;
        font-size: 14px;
        font-family: Arial, sans-serif;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
    }

    .update-btn {
        flex: 1;
        background-color: #333;
        color: #fff;
    }

    .update-btn:hover {
        background-color: #222;
    }

    .cancel-btn {
        background-color: #fff;
        color: #333;
    }

    .cancel-btn:hover {
        background-color: #f0f0f0;
    }

    @media (max-width: 480px) {
        .header {
            padding: 16px 20px;
        }

        .container {
            padding: 22px 18px;
            margin: 25px auto;
        }

        h1 {
            font-size: 23px;
        }

        .seat-grid {
            grid-template-columns: 1fr;
        }

        .buttons {
            flex-direction: column;
        }

        .update-btn,
        .cancel-btn {
            width: 100%;
        }
    }
  </style>
</head>

<body>

<div class="header">
  <h2>CineBook</h2>
</div>

<div class="container">

  <h1>Update Screen</h1>

  <form
          th:action="@{/screen/edit/{id}(id=${screen.screenId})}"
          th:object="${screen}"
          method="post">

    <input type="hidden" th:field="*{screenId}">

    <div class="form-group">
      <label for="screenName">Screen Name</label>
      <input
              type="text"
              id="screenName"
              th:field="*{screenName}"
              required>
    </div>

    <div class="form-group">
      <label for="theatre">Theatre</label>

      <select id="theatre" th:field="*{theatre}" required>
        <option
                th:each="theater : ${theaters}"
                th:value="${theater.theatreId}"
                th:text="${theater.theatreName + ' - ' + theater.location}">
        </option>
      </select>
    </div>

    <h3 class="section-title">Seat Configuration</h3>

    <div class="form-group">
      <label for="totalSeats">Total Seats</label>
      <input
              type="number"
              id="totalSeats"
              th:field="*{totalSeats}"
              min="1"
              required>
    </div>

    <div class="form-group">
      <label for="seatsPerRow">Seats Per Row</label>
      <input
              type="number"
              id="seatsPerRow"
              th:field="*{seatsPerRow}"
              min="1"
              required>
    </div>

    <div class="seat-grid">

      <div class="form-group">
        <label for="regularRows">Regular Rows</label>
        <input
                type="number"
                id="regularRows"
                th:field="*{regularRows}"
                min="0"
                required>
      </div>

      <div class="form-group">
        <label for="premiumRows">Premium Rows</label>
        <input
                type="number"
                id="premiumRows"
                th:field="*{premiumRows}"
                min="0"
                required>
      </div>

    </div>

    <div class="form-group">
      <label for="reclinerRows">Recliner Rows</label>
      <input
              type="number"
              id="reclinerRows"
              th:field="*{reclinerRows}"
              min="0"
              required>
    </div>

    <div class="buttons">
      <button type="submit" class="update-btn">
        Update Screen
      </button>

      <a th:href="@{/screens}" class="cancel-btn">
        Cancel
      </a>
    </div>

  </form>

</div>

</body>
</html>
