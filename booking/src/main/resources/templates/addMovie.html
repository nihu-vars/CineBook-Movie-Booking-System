
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Movie</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f5f7;
        color: #333;
        margin: 0;
        padding: 35px 20px;
    }

    h1 {
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        color: #292929;
        margin: 0 0 28px;
    }

    .form-container {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        padding: 28px;
        background-color: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #444;
    }

    input {
        display: block;
        width: 100%;
        padding: 11px 12px;
        margin-bottom: 20px;
        border: 1px solid #d5d5d5;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #333;
    }

    input:focus {
        outline: none;
        border-color: #777;
    }

    button {
        width: 100%;
        padding: 11px;
        background-color: #333;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
    }

    button:hover {
        background-color: #1f1f1f;
    }

    .back-link {
        display: block;
        width: fit-content;
        margin: 22px auto 0;
        color: #444;
        font-size: 14px;
        text-decoration: none;
    }

    .back-link:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        body {
            padding: 25px 14px;
        }

        h1 {
            font-size: 24px;
        }

        .form-container {
            padding: 22px 18px;
        }
    }
  </style>
</head>

<body>

<h1>Add Movie</h1>

<div class="form-container">

  <form action="/movies/add" method="post">

    <label for="title">
      Movie Title:
    </label>

    <input
            type="text"
            id="title"
            name="title"
            placeholder="Enter movie title"
            required
    >

    <button type="submit">
      Add Movie
    </button>

  </form>

</div>

<a href="/movies" class="back-link">
  Back to Movies
</a>

</body>

</html>
