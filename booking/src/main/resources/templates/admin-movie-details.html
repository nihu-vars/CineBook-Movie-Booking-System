
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${movie.movieTitle}">Movie Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f5f7;
            color: #333;
        }

        .header {
            background-color: #333;
            color: #fff;
            padding: 18px 30px;
        }

        .header h1 {
            max-width: 1100px;
            margin: 0 auto;
            font-size: 22px;
            font-weight: 600;
        }

        .container {
            width: calc(100% - 40px);
            max-width: 1000px;
            margin: 35px auto;
            background-color: #fff;
            padding: 28px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            display: flex;
            align-items: flex-start;
            gap: 30px;
        }

        .poster {
            width: 260px;
            flex-shrink: 0;
        }

        .poster img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .details {
            flex: 1;
            min-width: 0;
        }

        .details h1 {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.3;
            margin: 0 0 22px;
            color: #292929;
            overflow-wrap: anywhere;
        }

        .details p {
            font-size: 14px;
            line-height: 1.7;
            margin: 0;
            padding: 12px 0;
            border-bottom: 1px solid #ededed;
            overflow-wrap: anywhere;
        }

        .details p strong {
            display: inline-block;
            min-width: 105px;
            color: #555;
            font-weight: 600;
        }

        .back-btn,
        .book-btn {
            display: inline-block;
            margin-top: 22px;
            padding: 10px 16px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }

        .back-btn:hover,
        .book-btn:hover {
            background-color: #1f1f1f;
        }

        .book-btn {
            margin-left: 8px;
        }

        @media (max-width: 650px) {
            .header {
                padding: 16px 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .container {
                width: calc(100% - 28px);
                margin: 20px auto;
                padding: 20px;
                flex-direction: column;
                gap: 24px;
            }

            .poster {
                width: 100%;
                max-width: 240px;
                margin: 0 auto;
            }

            .details h1 {
                font-size: 24px;
            }

            .details p strong {
                min-width: 0;
                margin-right: 5px;
            }

            .back-btn,
            .book-btn {
                margin-top: 18px;
                margin-left: 0;
                margin-right: 6px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Movie Ticket Booking</h1>
</div>

<div class="container">

    <div class="poster">
        <img th:src="${movie.moviePosterUrl}"
             th:alt="${movie.movieTitle}">
    </div>

    <div class="details">

        <h1 th:text="${movie.movieTitle}">
            Movie Title
        </h1>

        <p>
            <strong>Description:</strong>
            <span th:text="${movie.movieDescription}"></span>
        </p>

        <p>
            <strong>Genre:</strong>
            <span th:text="${movie.movieGenre}"></span>
        </p>

        <p>
            <strong>Language:</strong>
            <span th:text="${movie.movieLanguages}"></span>
        </p>

        <p>
            <strong>Duration:</strong>
            <span th:text="${movie.movieDurationMinutes}"></span>
            minutes
        </p>

        <p>
            <strong>Rating:</strong>
            <span th:text="${movie.movieRating}"></span>
        </p>

        <p>
            <strong>Release Date:</strong>
            <span th:text="${movie.movieReleaseDate}"></span>
        </p>

        <a href="/user/movies" class="back-btn">
            Back to Movies
        </a>

        <!-- Booking will be implemented in a later phase -->
        <a th:href="@{/theatres}" class="book-btn">
            Add Theatres
        </a>

    </div>

</div>

</body>
</html>
