
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CineBook</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: #333;
    }

    header {
        background-color: #fff;
        padding: 18px 30px;
        border-bottom: 1px solid #e0e0e0;
    }

    header h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
    }

    .container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
    }

    .register-card {
        background-color: #fff;
        width: 100%;
        max-width: 420px;
        padding: 30px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
    }

    h1 {
        text-align: center;
        font-size: 25px;
        margin: 0 0 25px;
        font-weight: 600;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 500;
    }

    input {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        outline: none;
    }

    input:focus {
        border-color: #555;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #333;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 5px;
    }

    button:hover {
        background-color: #222;
    }

    .login-link {
        text-align: center;
        margin-top: 22px;
        font-size: 14px;
    }

    .login-link a {
        color: #333;
        text-decoration: none;
        font-weight: 600;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        header {
            padding: 16px 20px;
        }

        .register-card {
            padding: 24px 20px;
        }
    }
  </style>
</head>

<body>

<header>
  <h2>CineBook</h2>
</header>

<div class="container">
  <div class="register-card">

    <h1>Create Account</h1>

    <form action="/register" method="post">

      <div class="form-group">
        <label for="userEmail">Email:</label>
        <input type="email" id="userEmail" name="userEmail" required>
      </div>

      <div class="form-group">
        <label for="userPhone">Phone:</label>
        <input type="tel" id="userPhone" name="userPhone"
               pattern="[0-9]{10}" maxlength="10"
               title="Please enter a 10-digit phone number"
               required>
      </div>

      <div class="form-group">
        <label for="userPassword">Password:</label>
        <input type="password" id="userPassword"
               name="userPassword" required>
      </div>

      <button type="submit">Register</button>

    </form>

    <div class="login-link">
      Already have an account? <a href="/">Login</a>
    </div>

  </div>
</div>

</body>
</html>
