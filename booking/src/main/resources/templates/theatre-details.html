
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theatre Details - CineBook</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f5f5f5;
        color: #333;
    }

    header {
        background-color: #fff;
        padding: 18px 30px;
        border-bottom: 1px solid #e0e0e0;
    }

    header h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
    }

    .container {
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .details-card {
        background-color: #fff;
        padding: 30px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
    }

    h1 {
        font-size: 26px;
        margin: 0 0 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid #e5e5e5;
    }

    .detail {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 0;
        border-bottom: 1px solid #eee;
        font-size: 14px;
    }

    .detail:last-of-type {
        border-bottom: none;
    }

    .label {
        font-weight: 600;
        color: #555;
        flex-shrink: 0;
    }

    .value {
        text-align: right;
        overflow-wrap: anywhere;
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
    }

    .btn {
        display: inline-block;
        padding: 11px 18px;
        border: 1px solid #333;
        border-radius: 4px;
        background-color: #333;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        text-align: center;
    }

    .btn:hover {
        background-color: #222;
    }

    .btn-secondary {
        background-color: #fff;
        color: #333;
    }

    .btn-secondary:hover {
        background-color: #f0f0f0;
    }

    @media (max-width: 600px) {
        header {
            padding: 16px 20px;
        }

        .container {
            margin: 25px auto;
            padding: 0 12px;
        }

        .details-card {
            padding: 22px 18px;
        }

        h1 {
            font-size: 23px;
        }

        .detail {
            flex-direction: column;
            gap: 6px;
        }

        .value {
            text-align: left;
        }

        .actions {
            flex-direction: column;
        }

        .btn {
            width: 100%;
        }
    }
  </style>
</head>

<body>

<header>
  <h2>CineBook</h2>
</header>

<div class="container">
  <div class="details-card">

    <h1>Theatre Details</h1>

    <div class="detail">
      <span class="label">Theatre ID:</span>
      <span class="value" th:text="${theatre.theatreId}"></span>
    </div>

    <div class="detail">
      <span class="label">Theatre Name:</span>
      <span class="value" th:text="${theatre.theatreName}"></span>
    </div>

    <div class="detail">
      <span class="label">Location:</span>
      <span class="value" th:text="${theatre.location}"></span>
    </div>

    <div class="actions">
      <a href="/theatres" class="btn btn-secondary">
        Back to Theatres
      </a>

      <a th:href="@{/edit/{id}(id=${theatre.theatreId})}"
         class="btn">
        Edit Theatre
      </a>
    </div>

  </div>
</div>

</body>
</html>
