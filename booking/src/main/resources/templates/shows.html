
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Shows - CineBook</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background-color: #fff;
            padding: 18px 30px;
            border-bottom: 1px solid #e0e0e0;
        }

        header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .container {
            max-width: 1400px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 27px;
            margin: 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }

        .btn:hover {
            background-color: #222;
        }

        .btn-secondary {
            background-color: #fff;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #f0f0f0;
        }

        .table-card {
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
        }

        thead {
            background-color: #f0f0f0;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e5e5;
            font-size: 14px;
        }

        th {
            font-weight: 600;
            color: #444;
            white-space: nowrap;
        }

        tbody tr:hover {
            background-color: #fafafa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .actions .btn {
            padding: 7px 10px;
            font-size: 13px;
        }

        .delete-form {
            display: inline;
            margin: 0;
        }

        .delete {
            padding: 7px 10px;
            background-color: #fff;
            color: #555;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .delete:hover {
            background-color: #eee;
        }

        .empty-state {
            padding: 30px;
            text-align: center;
            color: #777;
        }

        .bottom-actions {
            margin-top: 25px;
        }

        @media (max-width: 600px) {
            header {
                padding: 16px 20px;
            }

            .container {
                margin: 25px auto;
                padding: 0 12px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            h1 {
                font-size: 24px;
            }

            .bottom-actions .btn {
                display: block;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>CineBook</h2>
</header>

<div class="container">

    <div class="page-header">
        <h1>All Shows</h1>

        <a href="/shows/add" class="btn">
            + Add New Show
        </a>
    </div>

    <div class="table-card">
        <div class="table-wrapper">

            <table>
                <thead>
                <tr>
                    <th>Show ID</th>
                    <th>Movie</th>
                    <th>Theatre</th>
                    <th>Screen</th>
                    <th>Date</th>
                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Price (₹)</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="show : ${shows}">

                    <td th:text="${show.showId}"></td>

                    <td th:text="${show.movieModel.movieTitle}"></td>

                    <td th:text="${show.screenModel.theatre.theatreName}"></td>

                    <td th:text="${show.screenModel.screenName}"></td>

                    <td th:text="${show.showDate}"></td>

                    <td th:text="${show.showStartTime}"></td>

                    <td th:text="${show.showEndTime}"></td>

                    <td th:text="${show.price}"></td>

                    <td>
                        <div class="actions">

                            <a th:href="@{/shows/{id}(id=${show.showId})}"
                               class="btn btn-secondary">
                                View
                            </a>

                            <a th:href="@{/shows/edit/{id}(id=${show.showId})}"
                               class="btn btn-secondary">
                                Edit
                            </a>

                            <form th:action="@{/shows/delete/{id}(id=${show.showId})}"
                                  method="post"
                                  class="delete-form"
                                  onsubmit="return confirm('Are you sure you want to delete this show?');">

                                <button type="submit" class="delete">
                                    Delete
                                </button>

                            </form>

                        </div>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(shows)}">
                    <td colspan="9" class="empty-state">
                        No shows available. Click "Add New Show" to create one.
                    </td>
                </tr>

                </tbody>
            </table>

        </div>
    </div>

    <div class="bottom-actions">
        <a th:href="@{/movies}" class="btn btn-secondary">
            Back to Movies
        </a>
    </div>

</div>

</body>
</html>
