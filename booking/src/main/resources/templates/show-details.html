
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Details - CineBook</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f5f5f5;
        color: #333;
    }

    header {
        background-color: #fff;
        padding: 18px 30px;
        border-bottom: 1px solid #e0e0e0;
    }

    header h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
    }

    .container {
        max-width: 700px;
        margin: 40px auto;
        padding: 30px;
        background-color: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
    }

    h1 {
        font-size: 26px;
        margin: 0 0 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid #e5e5e5;
    }

    .detail {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 0;
        border-bottom: 1px solid #eee;
        font-size: 14px;
    }

    .detail:last-of-type {
        border-bottom: none;
    }

    .label {
        font-weight: 600;
        color: #555;
        flex-shrink: 0;
    }

    .value {
        text-align: right;
        overflow-wrap: anywhere;
    }

    .actions {
        margin-top: 25px;
    }

    .btn {
        display: inline-block;
        padding: 11px 18px;
        background-color: #333;
        color: #fff;
        text-decoration: none;
        border: 1px solid #333;
        border-radius: 4px;
        font-size: 14px;
    }

    .btn:hover {
        background-color: #222;
    }

    @media (max-width: 600px) {
        header {
            padding: 16px 20px;
        }

        .container {
            margin: 25px 12px;
            padding: 22px 18px;
        }

        h1 {
            font-size: 23px;
        }

        .detail {
            flex-direction: column;
            gap: 6px;
        }

        .value {
            text-align: left;
        }

        .btn {
            width: 100%;
            text-align: center;
        }
    }
  </style>
</head>

<body>

<header>
  <h2>CineBook</h2>
</header>

<div class="container">

  <h1>Show Details</h1>

  <div class="detail">
    <span class="label">Show ID:</span>
    <span class="value" th:text="${show.showId}"></span>
  </div>

  <div class="detail">
    <span class="label">Movie:</span>
    <span class="value" th:text="${show.movieModel.movieTitle}"></span>
  </div>

  <div class="detail">
    <span class="label">Theatre:</span>
    <span class="value" th:text="${show.screenModel.theatre.theatreName}"></span>
  </div>

  <div class="detail">
    <span class="label">Location:</span>
    <span class="value" th:text="${show.screenModel.theatre.location}"></span>
  </div>

  <div class="detail">
    <span class="label">Screen:</span>
    <span class="value" th:text="${show.screenModel.screenName}"></span>
  </div>

  <div class="detail">
    <span class="label">Show Date:</span>
    <span class="value" th:text="${show.showDate}"></span>
  </div>

  <div class="detail">
    <span class="label">Start Time:</span>
    <span class="value" th:text="${show.showStartTime}"></span>
  </div>

  <div class="detail">
    <span class="label">End Time:</span>
    <span class="value" th:text="${show.showEndTime}"></span>
  </div>

  <div class="detail">
    <span class="label">Ticket Price:</span>
    <span class="value">
            ₹<span th:text="${show.price}"></span>
        </span>
  </div>

  <div class="actions">
    <a href="/shows" class="btn">Back to Shows</a>
  </div>

</div>

</body>
</html>
