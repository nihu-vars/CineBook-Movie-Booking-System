
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Screens - CineBook</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        color: #333;
    }

    header {
        background-color: #fff;
        padding: 18px 30px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
    }

    .container {
        max-width: 1200px;
        margin: 35px auto;
        padding: 0 20px;
    }

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
    }

    h1 {
        font-size: 27px;
        margin: 0;
    }

    .btn {
        display: inline-block;
        padding: 10px 15px;
        border: 1px solid #333;
        border-radius: 4px;
        background-color: #333;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        cursor: pointer;
        font-family: Arial, sans-serif;
        white-space: nowrap;
    }

    .btn:hover {
        background-color: #222;
    }

    .btn-secondary {
        background-color: #fff;
        color: #333;
    }

    .btn-secondary:hover {
        background-color: #f0f0f0;
    }

    .btn-delete {
        background-color: #fff;
        color: #555;
        border-color: #ccc;
    }

    .btn-delete:hover {
        background-color: #eee;
    }

    .table-card {
        background-color: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        overflow: hidden;
    }

    .table-wrapper {
        width: 100%;
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 800px;
    }

    thead {
        background-color: #f0f0f0;
    }

    th, td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #e5e5e5;
        font-size: 14px;
    }

    th {
        font-weight: 600;
        color: #444;
    }

    tbody tr:hover {
        background-color: #fafafa;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    .actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .actions .btn {
        padding: 7px 11px;
        font-size: 13px;
    }

    .delete-form {
        display: inline;
        margin: 0;
    }

    .empty-state {
        padding: 35px 20px;
        text-align: center;
        color: #777;
        font-size: 15px;
    }

    .navigation {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 25px;
    }

    @media (max-width: 600px) {
        header {
            padding: 16px 20px;
        }

        .container {
            margin: 25px auto;
            padding: 0 12px;
        }

        .page-header {
            align-items: flex-start;
            flex-direction: column;
        }

        h1 {
            font-size: 24px;
        }

        .navigation {
            flex-direction: column;
        }

        .navigation .btn {
            text-align: center;
        }
    }
  </style>
</head>

<body>

<header>
  <h2>CineBook</h2>
</header>

<div class="container">

  <div class="page-header">
    <h1>All Screens</h1>

    <a href="/screen/add" class="btn">
      + Add Screen
    </a>
  </div>

  <div class="table-card">
    <div class="table-wrapper">

      <table>
        <thead>
        <tr>
          <th>Screen ID</th>
          <th>Screen Name</th>
          <th>Total Seats</th>
          <th>Theatre</th>
          <th>Location</th>
          <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="screen : ${screens}">

          <td th:text="${screen.screenId}"></td>

          <td th:text="${screen.screenName}"></td>

          <td th:text="${screen.totalSeats}"></td>

          <td th:text="${screen.theatre.theatreName}"></td>

          <td th:text="${screen.theatre.location}"></td>

          <td>
            <div class="actions">

              <a th:href="@{/screens/{id}(id=${screen.screenId})}"
                 class="btn btn-secondary">
                View
              </a>

              <a th:href="@{/screen/edit/{id}(id=${screen.screenId})}"
                 class="btn btn-secondary">
                Edit
              </a>

              <form
                      th:action="@{/screens/delete/{id}(id=${screen.screenId})}"
                      method="post"
                      class="delete-form"
                      onsubmit="return confirm('Are you sure you want to delete this screen?');">

                <button type="submit" class="btn btn-delete">
                  Delete
                </button>

              </form>

            </div>
          </td>

        </tr>

        <tr th:if="${#lists.isEmpty(screens)}">
          <td colspan="6" class="empty-state">
            No screens available. Click "Add Screen" to create one.
          </td>
        </tr>

        </tbody>
      </table>

    </div>
  </div>

  <div class="navigation">
    <a href="/theatres" class="btn btn-secondary">
      Manage Theatres
    </a>

    <a th:href="@{/shows}" class="btn btn-secondary">
      Manage Shows
    </a>
  </div>

</div>

</body>
</html>
