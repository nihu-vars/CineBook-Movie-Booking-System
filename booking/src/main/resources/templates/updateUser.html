
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User</title>

  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        background-color: white;
        width: 380px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #444;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 11px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
    }

    input:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 4px rgba(0, 123, 255, 0.3);
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    button:hover {
        background-color: #0056b3;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #007bff;
        text-decoration: none;
    }

    .back-link:hover {
        text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Edit User</h1>

  <form th:action="@{/users/update}"
        th:object="${user}"
        method="post">

    <input type="hidden" th:field="*{userId}">

    <label for="userEmail">Email:</label>
    <input type="email" id="userEmail"
           th:field="*{userEmail}" required>

    <label for="userPhone">Phone:</label>
    <input type="text" id="userPhone"
           th:field="*{userPhone}" required>

    <label for="userPassword">Password:</label>
    <input type="password" id="userPassword"
           th:field="*{userPassword}" required>

    <button type="submit">Update User</button>

  </form>

  <a class="back-link" th:href="@{/users}">← Back to Users</a>

</div>

</body>
</html>
