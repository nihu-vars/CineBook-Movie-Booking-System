
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Theatre - CineBook</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        color: #333;
    }

    .header {
        background-color: #fff;
        padding: 18px 30px;
        border-bottom: 1px solid #e0e0e0;
    }

    .header h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
    }

    .container {
        width: 550px;
        max-width: calc(100% - 30px);
        margin: 45px auto;
        background-color: #fff;
        padding: 30px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
    }

    h1 {
        text-align: center;
        font-size: 26px;
        margin: 0 0 28px;
    }

    .form-group {
        margin-bottom: 22px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 600;
    }

    input {
        display: block;
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #fff;
        color: #333;
        font-family: Arial, sans-serif;
        font-size: 14px;
        outline: none;
    }

    input:focus {
        border-color: #666;
        box-shadow: 0 0 0 2px rgba(51, 51, 51, 0.08);
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 28px;
    }

    .update-btn,
    .cancel-btn {
        display: inline-block;
        padding: 12px 20px;
        border: 1px solid #333;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
    }

    .update-btn {
        flex: 1;
        background-color: #333;
        color: #fff;
    }

    .update-btn:hover {
        background-color: #222;
    }

    .cancel-btn {
        background-color: #fff;
        color: #333;
    }

    .cancel-btn:hover {
        background-color: #f0f0f0;
    }

    @media (max-width: 480px) {
        .header {
            padding: 16px 20px;
        }

        .container {
            padding: 22px 18px;
            margin: 28px auto;
        }

        h1 {
            font-size: 23px;
        }

        .buttons {
            flex-direction: column;
        }

        .update-btn,
        .cancel-btn {
            width: 100%;
        }
    }
  </style>
</head>

<body>

<div class="header">
  <h2>CineBook</h2>
</div>

<div class="container">

  <h1>Update Theatre</h1>

  <form
          th:action="@{/edit/{id}(id=${theatre.theatreId})}"
          th:object="${theatre}"
          method="post">

    <input type="hidden" th:field="*{theatreId}">

    <div class="form-group">
      <label for="theatreName">Theatre Name</label>

      <input
              type="text"
              id="theatreName"
              th:field="*{theatreName}"
              placeholder="Enter theatre name"
              required>
    </div>

    <div class="form-group">
      <label for="location">Location</label>

      <input
              type="text"
              id="location"
              th:field="*{location}"
              placeholder="Enter theatre location"
              required>
    </div>

    <div class="buttons">
      <button type="submit" class="update-btn">
        Update Theatre
      </button>

      <a th:href="@{/theatres}" class="cancel-btn">
        Cancel
      </a>
    </div>

  </form>

</div>

</body>
</html>
