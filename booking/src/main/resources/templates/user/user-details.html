<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            margin: 0;
            padding: 35px 20px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            color: #292929;
            margin: 0 0 28px;
        }

        .details-container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 28px;
            background-color: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
        }

        .user-info {
            margin-bottom: 24px;
        }

        .user-info p {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 0;
            margin: 0;
            border-bottom: 1px solid #ededed;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .user-info p:last-child {
            border-bottom: none;
        }

        .user-info strong {
            color: #555;
            font-weight: 600;
        }

        .user-info span {
            text-align: right;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .actions a {
            display: block;
            padding: 11px 14px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            color: #333;
            background-color: #fff;
            border: 1px solid #d5d5d5;
            border-radius: 5px;
        }

        .actions a:hover {
            background-color: #f5f5f5;
        }

        .actions .home-link {
            background-color: #333;
            color: #fff;
            border-color: #333;
        }

        .actions .home-link:hover {
            background-color: #1f1f1f;
        }

        .actions .delete-link {
            color: #b42318;
        }

        .actions .delete-link:hover {
            background-color: #fff4f2;
            border-color: #b42318;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 14px;
            }

            h1 {
                font-size: 24px;
            }

            .details-container {
                padding: 22px 18px;
            }
        }
    </style>
</head>

<body>

<h1>User Details</h1>

<div class="details-container">

    <div class="user-info">
        <p>
            <strong>User ID:</strong>
            <span th:text="${user.userId}"></span>
        </p>

        <p>
            <strong>Email:</strong>
            <span th:text="${user.userEmail}"></span>
        </p>

        <p>
            <strong>Phone:</strong>
            <span th:text="${user.userPhone}"></span>
        </p>
    </div>

    <div class="actions">

        <a th:href="@{/user/user-details/edit}">
            Edit User
        </a>

        <a class="delete-link"
           th:href="@{/user/user-details/delete}">
            Delete User
        </a>

        <a class="home-link"
           th:href="@{/user/movies}">
            Go to Home
        </a>

        <a th:href="@{/logOut}">
            Sign out
        </a>

    </div>

</div>

</body>

</html>
